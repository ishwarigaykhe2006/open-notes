<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="openNotes — Free Student Notes, Shared Openly" />
    <title>openNotes — Free Student Notes, Shared Openly</title>
    <script>
      try {
        var t = localStorage.getItem("opennotes:theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
